name: WTLST Outside SEO checks
on:
  pull_request:
    paths:
      - 'outside.mjs'
      - 'outside-content.mjs'
      - 'outside.test.mjs'
      - 'server.mjs'
      - '.github/workflows/outside-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server and editorial module syntax
        run: |
          node --check server.mjs
          node --check outside.mjs
          node --check outside-content.mjs
      - name: Editorial and SEO rendering checks
        run: node --test outside.test.mjs door-test-meta.test.mjs operator/door-flow-patch.test.mjs
