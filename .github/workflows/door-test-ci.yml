name: Door Test Share Preview Checks
on:
  pull_request:
    paths:
      - 'door-test-meta.mjs'
      - 'door-test-meta.test.mjs'
      - 'server.mjs'
      - 'the-test.html'
      - 'vercel.json'
      - '.github/workflows/door-test-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.mjs
      - run: node --test door-test-meta.test.mjs
