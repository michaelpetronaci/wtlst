name: Temporary Frontend Source Inspection
on:
  pull_request:
    paths:
      - '.github/workflows/door-source-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect first-party frontend source archive
        run: |
          echo '===== ZIP CONTENTS ====='
          unzip -Z1 wtlst-source.zip | head -100
          mkdir -p /tmp/wtlst-source
          unzip -q wtlst-source.zip -d /tmp/wtlst-source
          echo '===== FRONTEND PAGE REFERENCES ====='
          rg -n -C 10 'Make your|THE APPLICATION|wtlst-draft|view=apply|function App|useState\(.home.' /tmp/wtlst-source -g '*.tsx' -g '*.jsx' -g '*.ts' -g '*.js' | head -180 || true
          echo '===== BUILD CONFIGS ====='
          find /tmp/wtlst-source -maxdepth 4 \( -name 'vite*' -o -name 'package.json' \) | head -50
